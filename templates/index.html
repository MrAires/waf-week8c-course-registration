<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Online Student Course Registration</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 12px; box-sizing: border-box; }
        button { padding: 9px 18px; }
        table { border-collapse: collapse; width: 100%; margin-top: 25px; }
        th, td { border: 1px solid #999; padding: 8px; }
    </style>
</head>
<body>
    <h2>Online Student Course Registration System</h2>
    {% if message %}<p>{{ message }}</p>{% endif %}

    <form method="POST">
        <label>Student Name</label>
        <input type="text" name="student_name" required>
        <label>Roll Number</label>
        <input type="text" name="roll_number" required>
        <label>Select Course</label>
        <select name="course" required>
            <option value="">Select Course</option>
            <option>Web Application Frameworks</option>
            <option>Machine Learning</option>
            <option>Computer Networks</option>
            <option>Software Engineering</option>
            <option>Data Science</option>
        </select>
        <button type="submit">Register Course</button>
    </form>

    <h3>Registered Students</h3>
    <table>
        <tr><th>Student</th><th>Roll Number</th><th>Course</th></tr>
        {% for item in registrations %}
        <tr><td>{{ item.student_name }}</td><td>{{ item.roll_number }}</td><td>{{ item.course }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
